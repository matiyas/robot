# GPIO Pin Mapping (BCM numbering)
# Hardware: 2x DRV8833 motor drivers for wheels, SG90 servo for turret

motor_left:
  in1: 17  # Forward direction
  in2: 18  # Backward direction

motor_right:
  in1: 22  # Forward direction
  in2: 23  # Backward direction

# Shared enable pin for both DRV8833 drivers (EEP pins wired together)
motors_enable: 12  # PWM speed control for both motors

# Turret servo (SG90)
# Direct GPIO control - no DRV8833 driver needed
servo_turret:
  signal: 19  # PWM signal pin (hardware PWM capable)

# DRV8833 Truth Table (per wheel motor):
# IN1=LOW,  IN2=LOW   -> Coast (motor off)
# IN1=LOW,  IN2=HIGH  -> Backward/CCW
# IN1=HIGH, IN2=LOW   -> Forward/CW
# IN1=HIGH, IN2=HIGH  -> Brake
